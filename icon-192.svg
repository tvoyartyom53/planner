<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- Фон -->
  <rect width="500" height="400" fill="#000000" />

  <!-- Андроид -->
  <g id="android">
    <!-- Ноги -->
    <rect x="170" y="270" width="24" height="50" rx="12" fill="#74D11A" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="216" y="270" width="24" height="50" rx="12" fill="#74D11A" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Тело -->
    <rect x="150" y="160" width="110" height="110" fill="#74D11A" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Голова -->
    <path d="M 150 160 L 150 140 A 55 55 0 0 1 260 140 L 260 160 Z" fill="#74D11A" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Антенны -->
    <line x1="165" y1="90" x2="150" y2="60" stroke="#74D11A" stroke-width="6" stroke-linecap="round"/>
    <line x1="245" y1="90" x2="260" y2="60" stroke="#74D11A" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Глаза -->
    <circle cx="180" cy="130" r="8" fill="#FFFFFF"/>
    <circle cx="230" cy="130" r="8" fill="#FFFFFF"/>
    
    <!-- Рука, держащая "шланг" -->
    <rect x="230" y="180" width="60" height="20" rx="10" fill="#74D11A" stroke="#FFFFFF" stroke-width="4" transform="rotate(30 230 180)"/>
    
    <!-- Струя -->
    <path d="M 285 205 Q 330 230 370 200" fill="none" stroke="#B5D327" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Капли -->
    <path d="M 375 185 Q 380 175 385 185 Q 380 195 375 185 Z" fill="#B5D327"/>
    <path d="M 400 195 Q 405 185 410 195 Q 405 205 400 195 Z" fill="#B5D327"/>
    <path d="M 380 215 Q 385 205 390 215 Q 385 225 380 215 Z" fill="#B5D327"/>
  </g>

  <!-- Яблоко -->
  <g id="apple" transform="translate(365, 200)">
    <!-- Листик -->
    <path d="M -5 -25 Q 0 -40 15 -45 Q 10 -30 -5 -25 Z" fill="#B0B0B0" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Тело яблока с укусом -->
    <path d="M 0 -15 C -15 -25 -35 -15 -35 5 C -35 25 -15 45 0 35 C 5 32 10 32 15 35 C 30 45 50 25 50 5 C 50 -15 30 -25 15 -15 C 10 -12 5 -12 0 -15 Z" fill="#B0B0B0" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Укус (вырезаем круг цветом фона) -->
    <circle cx="45" cy="5" r="15" fill="#000000"/>
  </g>
</svg>
