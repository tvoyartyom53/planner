<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Мой Дневник</title>
<link rel="manifest" href="manifest.json">
<!-- Рукописные шрифты -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Marck+Script&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#1a1a1a;
    --paper:#222222;
    --text:#e0e0e0;
    --muted:#888;
    --accent:#f0f0f0;
    --border:#555;
    --green:#7CB342;
    --red:#E57373;
  }
  
  body{
    margin:0;
    font-family: 'Caveat', cursive, sans-serif;
    color:var(--text);
    padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));
    min-height:100vh;
    background-color: var(--bg);
    /* Текстура шума для эффекта бумаги */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    font-size: 20px;
  }
  
  .wrap{max-width:520px;margin:0 auto;padding:15px;position:relative}
  
  /* Шапка Дневника */
  .app-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 15px; padding-bottom: 5px;
  }
  .app-header h1 {
    font-family: 'Marck Script', cursive; font-size: 42px; margin: 0;
    line-height: 1; position: relative;
  }
  .app-header h1::after {
    content: ''; position: absolute; bottom: 5px; left: 0; right: 0;
    height: 3px; background: var(--border); transform: rotate(-2deg);
    border-radius: 50%; opacity: 0.7;
  }
  .app-header .crown { font-size: 24px; position: absolute; top: -15px; left: 20px; transform: rotate(-15deg); }
  
  /* Календарь */
  .month-nav { display: flex; justify-content: space-between; align-items: center; font-size: 26px; margin-bottom: 15px; font-family: 'Marck Script', cursive; }
  .month-nav button { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
  
  .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 16px; color: var(--muted); margin-bottom: 5px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; border: 1px solid var(--border); border-radius: 2px 255px 3px 225px / 255px 5px 225px 3px; padding: 10px 5px;}
  .cal-day { position: relative; padding: 8px 0; cursor: pointer; font-size: 18px; }
  .cal-day.other { color: #444; }
  
  /* Эффект каракулей на выбранном дне */
  .cal-day.selected::before {
    content: ''; position: absolute; inset: 2px;
    border: 2px solid var(--text); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    transform: rotate(-10deg) scale(1.1); z-index: -1; opacity: 0.8;
  }
  .cal-day.today { font-weight: bold; color: #fff; }
  
  /* Экран задач (День) */
  .day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; font-size: 24px; font-family: 'Marck Script', cursive; }
  .day-header .back { cursor: pointer; font-size: 28px; }
  
  /* Полоса дней недели */
  .week-strip { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; text-align: center; }
  .week-strip .w-day { flex: 1; cursor: pointer; font-size: 14px; color: var(--muted); }
  .week-strip .w-day .num { font-size: 18px; margin-top: 4px; display: inline-block; width: 30px; height: 30px; line-height: 30px; border-radius: 50%; }
  .week-strip .w-day.active .num { border: 2px solid var(--text); transform: rotate(-5deg); border-radius: 40% 60% 50% 50%; }
  
  /* Блоки Утро/День/Вечер */
  .time-block { margin-bottom: 20px; }
  .time-title { display: flex; align-items: center; gap: 10px; font-size: 24px; margin-bottom: 10px; border-bottom: 1px dashed var(--border); padding-bottom: 5px; }
  
  /* Задачи */
  ul { list-style: none; padding: 0; margin: 0; }
  .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; position: relative; }
  .task-chk {
    width: 20px; height: 20px; border: 2px solid var(--text); border-radius: 2px;
    cursor: pointer; flex-shrink: 0; margin-top: 3px; transform: rotate(-3deg);
    display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold;
  }
  .task-item.done .task-chk { background: var(--text); color: var(--bg); }
  .task-item.done .task-text { color: var(--muted); text-decoration: line-through; }
  .task-text { flex: 1; line-height: 1.2; }
  .task-time { font-size: 14px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .task-del { background: none; border: none; color: #555; font-size: 18px; cursor: pointer; padding: 0 5px; }
  
  /* Заметки внизу */
  .notes-box { margin-top: 20px; border: 1px solid var(--border); padding: 10px; border-radius: 2px; background: rgba(0,0,0,0.2); }
  .notes-box textarea { width: 100%; background: none; border: none; color: var(--text); font-family: 'Caveat', cursive; font-size: 18px; resize: none; outline: none; }

  /* Статистика (Калории) */
  .kcal-dashboard { text-align: center; margin-bottom: 20px; }
  .ring-container { position: relative; width: 140px; height: 140px; margin: 0 auto; }
  .ring-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #333; stroke-width: 6; }
  .ring-progress { fill: none; stroke: var(--text); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 283; transition: stroke-dashoffset 1s ease; }
  .ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .ring-text .num { font-size: 32px; line-height: 1; }

  /* Нижнее меню */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 15;
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  }
  .bottom-nav button { background: transparent; border: 0; color: var(--muted); font-family: 'Caveat', cursive; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  .bottom-nav button.active { color: var(--text); }
  .bottom-nav button .icon { font-size: 22px; filter: grayscale(1); transition: 0.2s; }
  .bottom-nav button.active .icon { filter: grayscale(0); transform: scale(1.1); }
  .center-btn { width: 46px; height: 46px; border-radius: 50% !important; border: 2px solid var(--border) !important; background: var(--paper) !important; transform: translateY(-10px); display: flex; justify-content: center; align-items: center; }
  .center-btn .icon { font-size: 28px !important; }

  /* Модальные окна */
  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal.open { display: flex; }
  .sheet { background: var(--paper); width: 100%; max-width: 400px; border-radius: 4px; padding: 20px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto;}
  
  input, select { width: 100%; padding: 10px; margin-bottom: 10px; background: transparent; border: 1px solid var(--border); color: var(--text); font-family: 'Caveat', cursive; font-size: 18px; border-radius: 4px; outline: none; }
  .btn { width: 100%; padding: 10px; background: var(--text); color: var(--bg); border: none; font-family: 'Caveat', cursive; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }

  /* Тосты */
  .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
  .toast { background: var(--paper); border: 2px solid var(--text); padding: 12px; border-radius: 2px 15px 3px 15px / 15px 5px 15px 3px; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); animation: slideDown 0.3s, fadeOut 0.3s 2.7s forwards; }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.fail { border-color: var(--red); color: var(--red); }
  @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }

  /* Сетка дней для шаблона */
  .days-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
  .days-grid button { padding: 8px; background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'Caveat', cursive; font-size: 16px; cursor: pointer; border-radius: 4px;}
  .days-grid button.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .tmpl-item { border-bottom: 1px dashed var(--border); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="wrap">
  
  <!-- ЭКРАН 1: КАЛЕНДАРЬ -->
  <div id="view-calendar" class="view active">
    <div class="app-header">
      <h1>Дневник</h1>
      <div class="crown">♛</div>
      <div style="font-size:24px;">⚙</div>
    </div>
    
    <div class="month-nav">
      <button onclick="shiftMonth(-1)">←</button>
      <span id="calMonthYear">Октябрь 2026</span>
      <button onclick="shiftMonth(1)">→</button>
    </div>
    
    <div class="cal-header">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    
    <div style="margin-top: 30px; font-style: italic; color: var(--muted); text-align: center;">
      Маленькие шаги<br>каждый день<br>= большие результаты<br>♡
    </div>
  </div>

  <!-- ЭКРАН 2: ЗАДАЧИ НА ДЕНЬ -->
  <div id="view-daily" class="view">
    <div class="day-header">
      <div class="back" onclick="switchView('calendar')">←</div>
      <div id="dailyDateLabel" style="text-decoration: underline wavy var(--border) 1px;">13 октября 2026</div>
      <div>...</div>
    </div>
    
    <!-- Полоса с днями недели -->
    <div class="week-strip" id="weekStrip"></div>
    
    <!-- Блоки задач -->
    <div id="tasksContainer"></div>

    <!-- Заметки на день -->
    <div class="notes-box">
      <div style="font-family: 'Marck Script', cursive; font-size: 22px; margin-bottom: 5px;">Заметки:</div>
      <textarea id="dailyNotes" rows="3" placeholder="• не забыть тетради..."></textarea>
    </div>
  </div>

  <!-- ЭКРАН 3: СТАТИСТИКА (КАЛОРИИ) -->
  <div id="view-stats" class="view">
    <div class="app-header"><h1 style="font-size: 32px;">Статистика</h1></div>
    
    <div class="kcal-dashboard">
      <div class="ring-container">
        <svg class="ring-svg" viewBox="0 0 100 100">
          <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
          <circle class="ring-progress" id="ringProgress" cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="ring-text">
          <div class="num" id="totalKcal">0</div>
          <div style="font-size:14px; color:var(--muted);">ккал</div>
        </div>
      </div>
      <div style="margin-top:10px; color:var(--muted);">Цель: 2500 ккал</div>
    </div>
    
    <div style="display:flex; gap:5px; flex-wrap:wrap;">
      <input type="text" id="foodName" placeholder="Что съел?" style="flex: 100%;" list="foodListData">
      <datalist id="foodListData"></datalist>
      <input type="number" id="foodKcal100" placeholder="Ккал/100г" style="flex:1;">
      <input type="number" id="foodWeight" placeholder="Вес (г)" value="100" style="flex:1;">
      <button onclick="addFood()" style="width: 40px; background:var(--text); color:var(--bg); border:none; font-size:24px; border-radius:4px; cursor:pointer;">+</button>
    </div>
    
    <ul id="foodList" style="margin-top:15px;"></ul>
  </div>

  <!-- ЭКРАН 4: ПРОФИЛЬ -->
  <div id="view-profile" class="view">
    <div class="app-header"><h1 style="font-size: 32px;">Профиль</h1></div>
    
    <div style="margin-bottom:20px;">
      <h3 style="font-family: 'Marck Script', cursive; font-size: 24px;">Мои шаблоны задач</h3>
      <div id="tmplList"></div>
    </div>
    
    <hr style="border-color: var(--border); margin: 20px 0;">
    <button class="btn" onclick="exportData()" style="background:transparent; border:1px solid var(--text); color:var(--text);">💾 Скачать бэкап</button>
    <button class="btn" onclick="document.getElementById('importFile').click()" style="background:transparent; border:1px solid var(--text); color:var(--text);">📂 Загрузить бэкап</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
  </div>

</div>

<!-- НИЖНЕЕ МЕНЮ -->
<div class="bottom-nav">
  <button id="nav-calendar" class="active" onclick="switchView('calendar')">
    <span class="icon">📅</span>Календарь
  </button>
  <button id="nav-daily" onclick="goTodayTasks()">
    <span class="icon">📋</span>Сегодня
  </button>
  <button class="center-btn" onclick="openPlusModal()">
    <span class="icon">➕</span>
  </button>
  <button id="nav-stats" onclick="switchView('stats')">
    <span class="icon">📊</span>Статистика
  </button>
  <button id="nav-profile" onclick="switchView('profile')">
    <span class="icon">👤</span>Профиль
  </button>
</div>

<!-- МОДАЛКА: ДОБАВЛЕНИЕ ПОВТОРЯЮЩЕЙСЯ ЗАДАЧИ (+) -->
<div class="modal" id="plusModal">
  <div class="sheet">
    <h2 style="font-family: 'Marck Script', cursive; margin-top:0;">Новая задача на неделю</h2>
    <input type="text" id="tmplInput" placeholder="Название задачи (например: спортзал)">
    <div style="margin-bottom:5px; color:var(--muted);">Выбери дни:</div>
    <div class="days-grid" id="tmplDays">
      <button onclick="toggleDay(1, this)">Пн</button>
      <button onclick="toggleDay(2, this)">Вт</button>
      <button onclick="toggleDay(3, this)">Ср</button>
      <button onclick="toggleDay(4, this)">Чт</button>
      <button onclick="toggleDay(5, this)">Пт</button>
      <button onclick="toggleDay(6, this)">Сб</button>
      <button onclick="toggleDay(0, this)">Вс</button>
    </div>
    <button class="btn" onclick="saveTemplate()">Создать задачу</button>
    <button class="btn" onclick="document.getElementById('plusModal').classList.remove('open')" style="background:transparent; color:var(--muted); margin-top:5px;">Отмена</button>
  </div>
</div>

<script>
const KEY='diary_v7'; 
const WEEKDAYS=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DAILY_GOAL = 2500; 

// ОГРОМНАЯ БАЗА ПРОДУКТОВ
const basicFoods = {
  "Яблоко": 52, "Банан": 89, "Апельсин": 47, "Груша": 57, "Виноград": 69, "Киви": 61, "Мандарин": 33, "Ананас": 50,
  "Куриная грудка": 165, "Куриное бедро": 209, "Куриное яйцо": 157, "Говядина": 250, "Свинина": 263, "Индейка": 144, "Фарш куриный": 143,
  "Рис отварной": 130, "Гречка отварная": 110, "Овсянка на воде": 88, "Макароны отварные": 131, "Картофель отварной": 82,
  "Хлеб белый": 265, "Хлеб черный": 210, "Батон": 260, "Лаваш": 275,
  "Кофе с молоком": 35, "Чай без сахара": 0, "Кола": 42, "Сок яблочный": 46, "Молоко 2.5%": 52, "Молоко 3.2%": 60,
  "Сыр Российский": 363, "Сыр Моцарелла": 240, "Творог 5%": 121, "Творог 9%": 159, "Йогурт натуральный": 60, "Кефир 1%": 40,
  "Сметана 20%": 206, "Майонез": 600, "Масло сливочное": 748, "Масло оливковое": 898,
  "Протеиновый батончик": 380, "Миндаль": 579, "Грецкий орех": 654, "Арахис": 567, "Семечки": 580,
  "Шоколад молочный": 535, "Шоколад темный": 546, "Печенье овсяное": 437, "Мороженое": 207, "Сахар": 400, "Мед": 304,
  "Помидор": 20, "Огурец": 15, "Капуста": 25, "Морковь": 35, "Лук": 40, "Перец болгарский": 27, "Брокколи": 34, "Авокадо": 160,
  "Суши Филадельфия": 180, "Пицца Пепперони": 270, "Бургер": 295, "Картофель фри": 312, "Шаурма": 215,
  "Греческий салат": 110, "Цезарь с курицей": 190, "Борщ": 50, "Суп куриный": 40, "Пельмени": 275, "Вареники": 250,
  "Рисовая каша": 100, "Пшенная каша": 90, "Кукурузная каша": 85, "Манная каша": 100, "Тушенка": 220,
  "Креветки": 99, "Лосось": 208, "Тунец": 132, "Сельдь": 217, "Горбуша": 142, "Скумбрия": 191,
  "Энергетик": 45, "Пиво": 43, "Вино красное": 85, "Водка": 235, "Квас": 30, "Компот": 60,
  "Оливки": 115, "Маслины": 115, "Кукуруза консерв.": 88, "Горошек": 73, "Фасоль": 123, "Чечевица": 116
};

// МАТНЫЕ ФРАЗЫ
const successPhrases = [
  "Охуенно! Так держать! 🔥",
  "Красавчик, ебать! Продолжай!",
  "Выполнено! Ты просто лучший! 💪",
  "Пиздато! Идём дальше!",
  "Есть! Отлично сделано, блять!",
  "Молодец! Не зря жрешь свой хлеб.",
  "Сделано! Горжусь тобой, чертяка!",
  "Збс! Ещё на шаг ближе к цели.",
  "Выполнил, красава! Не зазнавайся только."
];
const failPhrases = [
  "Ну и хуйня. Соберись! 😤",
  "Опять забил? Пидорас что ли?",
  "Не выполнил... грустно, блять. 📉",
  "Пиздец, не сдавайся! Верни галочку!",
  "Минус балл, блять. Иди работай.",
  "Руки из жопы? Исправляй давай.",
  "Хуёво. Ты можешь лучше!",
  "Обратный отсчёт пошёл. Не тупи.",
  "Слился? Ну и слабак."
];

// --- ИНИЦИАЛИЗАЦИЯ ДАННЫХ ---
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d) return { templates: d.templates||[], entries: d.entries||{}, done: d.done||{}, skipped: d.skipped||{}, food: d.food||{}, notes: d.notes||{} };
  } catch {}
  return { templates: [], entries: {}, done: {}, skipped: {}, food: {}, notes: {} };
}
let state = load();
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => n < 10 ? '0' + n : '' + n;

let currentDateObj = new Date();
let selectedDate = currentDateObj.getFullYear() + '-' + pad(currentDateObj.getMonth()+1) + '-' + pad(currentDateObj.getDate());

// --- ТОСТЫ ---
function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

// --- НАВИГАЦИЯ ---
function switchView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  
  document.getElementById('view-' + viewId).classList.add('active');
  const navBtn = document.getElementById('nav-' + viewId);
  if (navBtn) navBtn.classList.add('active');
  
  if (viewId === 'calendar') renderCalendar();
  if (viewId === 'daily') renderDaily();
  if (viewId === 'stats') renderCalories();
  if (viewId === 'profile') renderTemplates();
}

// Функция для кнопки "Сегодня" в меню
function goTodayTasks() {
  const today = new Date();
  selectedDate = today.getFullYear() + '-' + pad(today.getMonth()+1) + '-' + pad(today.getDate());
  switchView('daily');
}

// --- ЛОГИКА КАЛЕНДАРЯ ---
function renderCalendar() {
  const year = currentDateObj.getFullYear();
  const month = currentDateObj.getMonth();
  document.getElementById('calMonthYear').textContent = `${MONTHS[month]} ${year}`;
  
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  
  let firstDay = new Date(year, month, 1).getDay();
  if (firstDay === 0) firstDay = 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  
  // Пустые ячейки
  for (let i = 1; i < firstDay; i++) grid.innerHTML += `<div class="cal-day other"></div>`;
  
  // Дни
  for (let i = 1; i <= daysInMonth; i++) {
    const iso = `${year}-${pad(month+1)}-${pad(i)}`;
    const isSelected = iso === selectedDate ? 'selected' : '';
    const isToday = iso === (new Date().getFullYear() + '-' + pad(new Date().getMonth()+1) + '-' + pad(new Date().getDate())) ? 'today' : '';
    grid.innerHTML += `<div class="cal-day ${isSelected} ${isToday}" onclick="openDay('${iso}')">${i}</div>`;
  }
}
function shiftMonth(n) { currentDateObj.setMonth(currentDateObj.getMonth() + n); renderCalendar(); }
function openDay(iso) { selectedDate = iso; switchView('daily'); }

// --- ЛОГИКА ДНЯ ---
function renderDaily() {
  const d = new Date(selectedDate);
  document.getElementById('dailyDateLabel').textContent = `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
  
  // Полоса дней
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  const dayOfWeek = d.getDay() === 0 ? 7 : d.getDay(); // Пн=1, Вс=7
  const monday = new Date(d);
  monday.setDate(d.getDate() - dayOfWeek + 1);
  
  for (let i = 0; i < 7; i++) {
    const tempD = new Date(monday);
    tempD.setDate(monday.getDate() + i);
    const iso = tempD.getFullYear() + '-' + pad(tempD.getMonth()+1) + '-' + pad(tempD.getDate());
    const isActive = iso === selectedDate ? 'active' : '';
    strip.innerHTML += `<div class="w-day ${isActive}" onclick="openDay('${iso}')">
      <div>${WEEKDAYS[tempD.getDay()]}</div>
      <div class="num">${tempD.getDate()}</div>
    </div>`;
  }
  
  // Заметки
  document.getElementById('dailyNotes').value = state.notes[selectedDate] || '';
  
  // Задачи
  const tasks = getTasksForDate(selectedDate);
  const container = document.getElementById('tasksContainer');
  container.innerHTML = '';
  
  // Группировка (Утро / День / Вечер)
  const groups = { "Утро": [], "День": [], "Вечер": [] };
  tasks.forEach(t => {
    if (t.title.toLowerCase().includes('зарядк') || t.title.toLowerCase().includes('кофе')) groups["Утро"].push(t);
    else if (t.title.toLowerCase().includes('спать') || t.title.toLowerCase().includes('вечер')) groups["Вечер"].push(t);
    else groups["День"].push(t);
  });

  Object.keys(groups).forEach(groupName => {
    if (groups[groupName].length === 0 && groupName !== 'День') return;
    const icons = { "Утро": "☀️", "День": "🌤", "Вечер": "🌙" };
    let html = `<div class="time-block"><div class="time-title">${icons[groupName]} ${groupName}</div><ul>`;
    
    groups[groupName].forEach(t => {
      html += `<li class="task-item ${t.done ? 'done' : ''}">
        <div class="task-chk" onclick="toggleTask('${t.key}', ${t.done})">${t.done ? '✔' : ''}</div>
        <div class="task-text">${t.title}</div>
        <button class="task-del" onclick="deleteTask('${t.key}')">✕</button>
      </li>`;
    });
    html += `</ul></div>`;
    container.innerHTML += html;
  });
}

function getTasksForDate(iso) {
  const wd = new Date(iso).getDay();
  const skipped = state.skipped[iso] || {};
  const done = state.done[iso] || {};
  
  const tpl = state.templates.filter(t => t.days.includes(wd) && !skipped[t.id]).map(t => ({ key: 't:'+t.id, title: t.title, done: !!done[t.id], id: t.id }));
  const custom = (state.entries[iso] || []).map(e => ({ key: 'c:'+e.id, title: e.title, done: !!e.done, id: e.id }));
  return [...tpl, ...custom];
}

function toggleTask(key, currentDone) {
  const [type, id] = key.split(':');
  const iso = selectedDate;
  
  if (type === 't') {
    state.done[iso] = state.done[iso] || {};
    state.done[iso][id] = !currentDone;
  } else {
    const e = (state.entries[iso] || []).find(x => x.id === id);
    if (e) e.done = !currentDone;
  }
  save();
  renderDaily();

  if (!currentDone) showToast(successPhrases[Math.floor(Math.random() * successPhrases.length)], 'success');
  else showToast(failPhrases[Math.floor(Math.random() * failPhrases.length)], 'fail');
}

function deleteTask(key) {
  const [type, id] = key.split(':');
  if (type === 't') {
    state.skipped[selectedDate] = state.skipped[selectedDate] || {};
    state.skipped[selectedDate][id] = true;
  } else {
    state.entries[selectedDate] = (state.entries[selectedDate] || []).filter(x => x.id !== id);
  }
  save(); renderDaily();
}

// Сохранение заметок при вводе
document.getElementById('dailyNotes').addEventListener('input', (e) => {
  state.notes[selectedDate] = e.target.value;
  save();
});

// --- ПЛЮС (ДОБАВЛЕНИЕ ШАБЛОНОВ) ---
let selectedDays = [];
function openPlusModal() {
  document.getElementById('tmplInput').value = '';
  selectedDays = [];
  document.querySelectorAll('#tmplDays button').forEach(b => b.classList.remove('on'));
  document.getElementById('plusModal').classList.add('open');
}
function toggleDay(day, btn) {
  if (selectedDays.includes(day)) {
    selectedDays = selectedDays.filter(d => d !== day);
    btn.classList.remove('on');
  } else {
    selectedDays.push(day);
    btn.classList.add('on');
  }
}
function saveTemplate() {
  const title = document.getElementById('tmplInput').value.trim();
  if (!title || selectedDays.length === 0) { showToast("Заполни название и выбери дни, еб твою мать!", "fail"); return; }
  state.templates.push({ id: uid(), title, days: selectedDays });
  save();
  document.getElementById('plusModal').classList.remove('open');
  showToast("Задача добавлена на неделю!", "success");
  renderDaily();
}

// --- КАЛОРИИ ---
function renderCalories() {
  const foods = state.food[selectedDate] || [];
  const list = document.getElementById('foodList');
  list.innerHTML = '';
  let total = 0;

  foods.forEach(f => {
    total += Number(f.totalKcal) || 0;
    list.innerHTML += `<li class="task-item" style="border-bottom:1px dashed var(--border);">
      <div class="task-text">${f.name} <small style="color:var(--muted)">(${f.weight}г)</small></div>
      <div style="color:var(--text); font-weight:bold;">${f.totalKcal} ккал</div>
      <button class="task-del" onclick="delFood('${f.id}')">✕</button>
    </li>`;
  });

  document.getElementById('totalKcal').textContent = Math.round(total);
  const progressCircle = document.getElementById('ringProgress');
  const circumference = 2 * Math.PI * 45; 
  let percent = Math.min(total / DAILY_GOAL, 1);
  progressCircle.style.strokeDashoffset = circumference - (percent * circumference);
  
  // Автодополнение
  const datalist = document.getElementById('foodListData');
  datalist.innerHTML = '';
  Object.keys(basicFoods).forEach(k => {
    datalist.innerHTML += `<option value="${k}">`;
  });
}

document.getElementById('foodName').addEventListener('input', (e) => {
  const val = e.target.value;
  if (basicFoods[val]) document.getElementById('foodKcal100').value = basicFoods[val];
});

function addFood() {
  const name = document.getElementById('foodName').value.trim();
  const kcal100 = parseFloat(document.getElementById('foodKcal100').value);
  const weight = parseFloat(document.getElementById('foodWeight').value);
  if (!name || isNaN(kcal100) || isNaN(weight)) { showToast("Заполни всё, долбоёб!", "fail"); return; }
  
  const totalKcal = Math.round((kcal100 / 100) * weight);
  state.food[selectedDate] = state.food[selectedDate] || [];
  state.food[selectedDate].push({ id: uid(), name, kcal100, weight, totalKcal });
  
  document.getElementById('foodName').value = ''; 
  document.getElementById('foodKcal100').value = '';
  save(); renderCalories();
}
function delFood(id) {
  state.food[selectedDate] = state.food[selectedDate].filter(x => x.id !== id);
  save(); renderCalories();
}

// --- ПРОФИЛЬ И БЭКАПЫ ---
function renderTemplates() {
  const list = document.getElementById('tmplList');
  list.innerHTML = '';
  if (!state.templates.length) list.innerHTML = '<div style="color:var(--muted)">Нет повторяющихся задач.</div>';
  
  state.templates.forEach(t => {
    const daysStr = t.days.map(d => WEEKDAYS[d]).join(', ');
    list.innerHTML += `<div class="tmpl-item">
      <div><b>${t.title}</b><br><small style="color:var(--muted)">${daysStr}</small></div>
      <button class="task-del" onclick="delTmpl('${t.id}')">✕</button>
    </div>`;
  });
}
function delTmpl(id) {
  state.templates = state.templates.filter(t => t.id !== id);
  save(); renderTemplates();
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'diary-backup.json'; a.click();
}
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!confirm('Заменить текущие данные?')) return;
      state = data;
      save();
      renderCalendar(); renderTemplates(); renderDaily();
      showToast("Данные загружены!", "success");
    } catch { showToast("Ошибка файла!", "fail"); }
  };
  reader.readAsText(file);
}

// --- СТАРТ ---
renderCalendar();
switchView('calendar');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
