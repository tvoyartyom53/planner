<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Твой Дневник</title>
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a0a;
    --card:#151515;
    --card-hover:#1f1f1f;
    --muted:#888888;
    --text:#ffffff;
    --accent:#39FF14; /* Тот самый неоновый зеленый */
    --accent-dim:rgba(57,255,20,0.15);
    --border:#2a2a2a;
    --danger:#ff4d4d;
  }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  
  /* Шапка */
  header{display:flex;align-items:center;gap:8px;margin-bottom:20px}
  header button{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    width:44px;height:44px;border-radius:50%;font-size:16px;cursor:pointer;
    transition:all 0.2s;display:flex;align-items:center;justify-content:center;
  }
  header button:active{transform:scale(0.9);background:var(--card-hover)}
  header .title{flex:1;text-align:center;cursor:pointer;padding:8px;border-radius:12px;transition:background 0.2s}
  header .title:active{background:var(--card)}
  header .title .d{font-size:20px;font-weight:700;letter-spacing:-0.5px}
  header .title .w{font-size:12px;color:var(--muted);text-transform:uppercase;margin-top:2px;font-weight:600;letter-spacing:0.5px}
  
  /* Поля ввода */
  input{
    width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:16px;outline:none;transition:all 0.2s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
  
  .input-group{position:relative;flex:2}
  .suggestions{
    position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);
    border:1px solid var(--border);border-radius:12px;max-height:200px;overflow-y:auto;
    z-index:20;display:none;box-shadow:0 10px 25px rgba(0,0,0,0.8);
  }
  .suggestions.open{display:block}
  .suggestion-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:15px;transition:background 0.2s}
  .suggestion-item:active{background:var(--card-hover)}
  
  .add-row{display:flex;gap:8px;margin-bottom:16px;position:relative;flex-wrap:wrap}
  .add-row button{
    padding:0 20px;border-radius:14px;border:0;background:var(--accent);color:#000;
    font-size:24px;font-weight:bold;cursor:pointer;transition:all 0.2s;
  }
  .add-row button:active{transform:scale(0.9)}
  
  /* Списки */
  ul{list-style:none;padding:0;margin:0}
  li{
    display:flex;align-items:center;gap:12px;padding:16px;
    background:var(--card);border-radius:16px;margin-bottom:10px;
    border:1px solid var(--border);transition:all 0.2s;
  }
  li:active{transform:scale(0.98);background:var(--card-hover)}
  
  /* Кружок выполнения */
  li .chk{
    width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);
    cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:all 0.2s;
  }
  li.done .chk{background:var(--accent);border-color:var(--accent)}
  li.done .chk::after{content:'✓';color:#000;font-size:16px;font-weight:900}
  
  li .t{flex:1;word-break:break-word;font-size:16px;font-weight:500;transition:all 0.2s}
  li.done .t{color:var(--muted);text-decoration:line-through}
  
  li .x{background:transparent;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
  
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
  
  /* Нижнее меню (Плавающее, стеклянное) */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:15;
    background:rgba(21,21,21,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav button{
    flex:1;background:transparent;border:0;color:var(--muted);
    padding:16px 0;font-size:13px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;transition:color 0.2s;
  }
  .bottom-nav button .icon{font-size:20px}
  .bottom-nav button.active{color:var(--accent)}

  /* Блок калорий (Главная плашка) */
  .kcal-dashboard{
    background:var(--card);border:1px solid var(--border);border-radius:20px;
    padding:20px;margin-bottom:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.3);
  }
  .kcal-dashboard .label{font-size:14px;color:var(--muted);margin-bottom:8px;font-weight:500}
  .kcal-dashboard .total{font-size:36px;font-weight:800;color:var(--accent);line-height:1.1}
  .kcal-dashboard .unit{font-size:16px;font-weight:600;color:var(--muted)}
  
  .food-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px 16px;border-radius:16px;margin-bottom:10px;border:1px solid var(--border);transition:all 0.2s}
  .food-item:active{background:var(--card-hover)}
  .food-item .name{flex:1;font-size:16px;font-weight:500}
  .food-item .name span{font-size:13px;color:var(--muted);margin-left:6px;font-weight:400}
  .food-item .kcal{font-weight:700;color:var(--accent);margin-right:12px;font-size:15px}
  
  /* Плавающая кнопка ⚙ */
  .fab{
    position:fixed;bottom:90px;right:20px;width:56px;height:56px;border-radius:50%;
    background:var(--card);border:1px solid var(--border);color:var(--text);
    font-size:24px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,0.5);z-index:5;
    display:flex;align-items:center;justify-content:center;transition:all 0.2s;
  }
  .fab:active{transform:scale(0.9);background:var(--card-hover)}
  
  /* Модалка */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:10;opacity:0;transition:opacity 0.3s}
  .modal.open{display:flex;opacity:1}
  .sheet{
    background:var(--bg);width:100%;max-height:85vh;overflow:auto;
    border-radius:24px 24px 0 0;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .modal.open .sheet{transform:translateY(0)}
  
  .sheet h2{margin:0 0 20px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
  .sheet h2 button{background:var(--card);border:0;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer}
  
  .tmpl{padding:16px;background:var(--card);border-radius:16px;margin-bottom:12px;border:1px solid var(--border)}
  .tmpl-top{display:flex;gap:8px;align-items:center}
  .tmpl-top .t{flex:1;font-size:16px;font-weight:500}
  .tmpl-top .x{background:transparent;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  .days{display:flex;gap:6px;margin-top:12px}
  .days button{
    flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;
  }
  .days button.on{background:var(--accent);border-color:var(--accent);color:#000}
  
  .hint{font-size:13px;color:var(--muted);margin:8px 0}
  .btn2{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:background 0.2s}
  .btn2:active{background:var(--card-hover)}
  
  .view{display:none;animation:fadeIn 0.3s ease}
  .view.active{display:block}

  @keyframes fadeIn { from {opacity:0;transform:translateY(5px);} to {opacity:1;transform:translateY(0);} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="prev">◀</button>
    <div class="title" id="dateWrap">
      <div class="d" id="dateLabel"></div>
      <div class="w" id="weekdayLabel"></div>
    </div>
    <button id="next">▶</button>
  </header>

  <!-- ВКЛАДКА 1: ЗАДАЧИ -->
  <div id="view-tasks" class="view active">
    <div class="add-row">
      <input type="text" id="addInput" placeholder="Новая задача...">
      <button id="addBtn">+</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none">Задач пока нет</div>
    <button class="fab" id="openTmpl">⚙</button>
  </div>

  <!-- ВКЛАДКА 2: КАЛОРИИ -->
  <div id="view-calories" class="view">
    <!-- Красивая плашка как на дизайне -->
    <div class="kcal-dashboard">
      <div class="label">Съедено за сегодня</div>
      <div><span class="total" id="totalKcal">0</span> <span class="unit">ккал</span></div>
    </div>
    
    <div class="add-row">
      <div class="input-group" style="width: 100%; flex: none; margin-bottom: 6px;">
        <input type="text" id="foodName" placeholder="Что съел? (начни вводить)" autocomplete="off">
        <div id="foodSuggestions" class="suggestions"></div>
      </div>
    </div>
    
    <div class="add-row">
      <input type="number" id="foodKcal100" placeholder="Ккал/100г" style="flex:1;">
      <input type="number" id="foodWeight" placeholder="Вес (г)" value="100" style="flex:1;">
      <button id="addFoodBtn">+</button>
    </div>

    <ul id="foodList"></ul>
    <div class="empty" id="emptyFood" style="display:none">Ничего не добавлено</div>
  </div>

</div>

<!-- НИЖНЕЕ МЕНЮ (Дизайн как в макете) -->
<div class="bottom-nav">
  <button id="navTasks" class="active"><span class="icon">📝</span>Задачи</button>
  <button id="navCalories"><span class="icon">🔥</span>Калории</button>
</div>

<!-- МОДАЛКА ШАБЛОНОВ -->
<div class="modal" id="modal">
  <div class="sheet">
    <h2>Шаблоны на неделю <button id="closeTmpl">✕</button></h2>
    <div class="add-row">
      <input type="text" id="tmplInput" placeholder="Например: спортзал">
      <button id="tmplAdd">+</button>
    </div>
    <div class="hint">Отметь дни — задача будет появляться каждую неделю.</div>
    <div id="tmplList"></div>
    <div class="hint" style="margin-top:20px">Резервная копия:</div>
    <button class="btn2" id="exportBtn">💾 Скачать бэкап (JSON)</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="btn2" id="importBtn">📂 Импортировать бэкап</button>
  </div>
</div>

<script>
// Ключ оставил v4, чтобы твои сохраненные данные не потерялись!
const KEY='planner_v4'; 
const WEEKDAYS=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const ORDER=[1,2,3,4,5,6,0];

const basicFoods = {
  "Яблоко": 52, "Банан": 89, "Апельсин": 47, "Груша": 57, 
  "Куриная грудка": 165, "Куриное яйцо": 157, "Творог 5%": 121, 
  "Рис отварной": 130, "Гречка отварная": 110, "Овсянка на воде": 88,
  "Макароны отварные": 131, "Картофель отварной": 82, "Хлеб белый": 265,
  "Кофе с молоком": 35, "Чай без сахара": 0, "Кола": 42,
  "Сыр Российский": 363, "Молоко 2.5%": 52, "Йогурт натуральный": 60,
  "Сметана 20%": 206, "Майонез": 600,
  "Протеиновый батончик": 380, "Миндаль": 579, "Грецкий орех": 654
};

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d) return {
      templates:d.templates||[], entries:d.entries||{}, done:d.done||{}, skipped:d.skipped||{},
      food:d.food||{}, customFoods:d.customFoods||{}
    };
  }catch{}
  return {templates:[],entries:{},done:{},skipped:{},food:{},customFoods:{}};
}
let state=load();
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>n<10?'0'+n:''+n;
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const getWeekday=iso=>{const p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getDay();};
function shiftDate(iso,n){const p=iso.split('-').map(Number);const dt=new Date(p[0],p[1]-1,p[2]+n);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
const formatDate=iso=>{const p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0];};

let currentDate=todayISO();

// --- ЗАДАЧИ ---
function getTasks(iso){
  const wd=getWeekday(iso);
  const skipped=state.skipped[iso]||{};
  const done=state.done[iso]||{};
  const tpl=state.templates.filter(t=>t.days.includes(wd)&&!skipped[t.id]).map(t=>({key:'t:'+t.id,title:t.title,done:!!done[t.id],templateId:t.id}));
  const custom=(state.entries[iso]||[]).map(e=>({key:'c:'+e.id,title:e.title,done:!!e.done,customId:e.id}));
  return [...tpl,...custom];
}
function renderTasks(){
  const list=document.getElementById('list');
  const tasks=getTasks(currentDate);
  list.innerHTML='';
  tasks.forEach(t=>{
    const li=document.createElement('li');
    if(t.done) li.className='done';
    const chk=document.createElement('div');chk.className='chk';chk.onclick=()=>toggleTask(t);
    const title=document.createElement('div');title.className='t';title.textContent=t.title;
    const x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=()=>removeTask(t);
    li.append(chk,title,x); list.appendChild(li);
  });
  document.getElementById('empty').style.display=tasks.length?'none':'block';
}
function toggleTask(t){
  const iso=currentDate;
  if(t.templateId){state.done[iso]=state.done[iso]||{};state.done[iso][t.templateId]=!t.done;}
  else{const e=(state.entries[iso]||[]).find(x=>x.id===t.customId);if(e) e.done=!e.done;}
  save();renderTasks();
}
function removeTask(t){
  const iso=currentDate;
  if(t.templateId){state.skipped[iso]=state.skipped[iso]||{};state.skipped[iso][t.templateId]=true;}
  else{state.entries[iso]=(state.entries[iso]||[]).filter(x=>x.id!==t.customId);}
  save();renderTasks();
}
function addCustom(){
  const inp=document.getElementById('addInput');
  const title=inp.value.trim(); if(!title) return;
  const iso=currentDate;
  state.entries[iso]=state.entries[iso]||[];
  state.entries[iso].push({id:uid(),title,done:false});
  inp.value=''; save(); renderTasks();
}

// --- КАЛОРИИ ---
const foodNameInput = document.getElementById('foodName');
const foodKcal100Input = document.getElementById('foodKcal100');
const foodWeightInput = document.getElementById('foodWeight');
const suggestionsBox = document.getElementById('foodSuggestions');

foodNameInput.addEventListener('input', (e) => {
  const query = e.target.value.trim().toLowerCase();
  suggestionsBox.innerHTML = '';
  if(!query) { suggestionsBox.classList.remove('open'); return; }
  const allFoods = {...basicFoods, ...state.customFoods};
  let matches = [];
  for(let name in allFoods) { if(name.toLowerCase().includes(query)) matches.push({name, kcal: allFoods[name]}); }
  if(matches.length > 0) {
    matches.slice(0, 5).forEach(m => {
      const div = document.createElement('div'); div.className = 'suggestion-item';
      div.innerHTML = `<span>${m.name}</span> <span style="color:var(--accent);font-weight:bold;">${m.kcal} ккал</span>`;
      div.onclick = () => { foodNameInput.value = m.name; foodKcal100Input.value = m.kcal; suggestionsBox.classList.remove('open'); foodWeightInput.focus(); };
      suggestionsBox.appendChild(div);
    });
    suggestionsBox.classList.add('open');
  } else { suggestionsBox.classList.remove('open'); }
});

document.addEventListener('click', (e) => { if(!e.target.closest('.input-group')) suggestionsBox.classList.remove('open'); });

function renderCalories(){
  const iso=currentDate;
  const foods=state.food[iso]||[];
  const list=document.getElementById('foodList');
  list.innerHTML='';
  let total=0;

  foods.forEach(f=>{
    total += Number(f.totalKcal) || 0;
    const li=document.createElement('li'); li.className='food-item';
    const name=document.createElement('div');name.className='name'; name.innerHTML = `${f.name} <span>(${f.weight}г)</span>`;
    const kcal=document.createElement('div');kcal.className='kcal';kcal.textContent=f.totalKcal + ' ккал';
    const x=document.createElement('button');x.className='x';x.textContent='✕';
    x.onclick=()=>{ state.food[iso]=state.food[iso].filter(item=>item.id!==f.id); save();renderCalories(); };
    li.append(name, kcal, x); list.appendChild(li);
  });

  document.getElementById('totalKcal').textContent = Math.round(total);
  document.getElementById('emptyFood').style.display=foods.length?'none':'block';
}

function addFood(){
  const name=foodNameInput.value.trim();
  const kcal100=parseFloat(foodKcal100Input.value);
  const weight=parseFloat(foodWeightInput.value);
  if(!name || isNaN(kcal100) || isNaN(weight) || weight <= 0) { alert("Заполни название, ккал и вес!"); return; }
  const totalKcal = Math.round((kcal100 / 100) * weight);
  const iso=currentDate;
  state.food[iso]=state.food[iso]||[];
  state.food[iso].push({id:uid(), name, kcal100, weight, totalKcal});
  state.customFoods[name] = kcal100;
  foodNameInput.value=''; foodKcal100Input.value=''; foodWeightInput.value='100';
  save(); renderCalories(); foodNameInput.focus();
}

// --- ОБЩИЙ РЕНДЕР ---
function renderHeader(){
  document.getElementById('dateLabel').textContent=formatDate(currentDate);
  document.getElementById('weekdayLabel').textContent=WEEKDAYS[getWeekday(currentDate)]+(currentDate===todayISO()?' • сегодня':'');
}
function render(){ renderHeader(); renderTasks(); renderCalories(); }

function switchView(view){
  document.getElementById('view-tasks').classList.remove('active');
  document.getElementById('view-calories').classList.remove('active');
  document.getElementById('navTasks').classList.remove('active');
  document.getElementById('navCalories').classList.remove('active');
  document.getElementById('view-'+view).classList.add('active');
  document.getElementById('nav'+(view==='tasks'?'Tasks':'Calories')).classList.add('active');
}

// --- ШАБЛОНЫ ---
function renderTemplates(){
  const box=document.getElementById('tmplList');
  box.innerHTML='';
  if(!state.templates.length){box.innerHTML='<div class="hint">Пока нет шаблонов.</div>';return;}
  state.templates.forEach(t=>{
    const div=document.createElement('div');div.className='tmpl';
    const top=document.createElement('div');top.className='tmpl-top';
    const title=document.createElement('div');title.className='t';title.textContent=t.title;
    const x=document.createElement('button');x.className='x';x.textContent='✕';
    x.onclick=()=>{state.templates=state.templates.filter(t2=>t2.id!==t.id);save();renderTemplates();renderTasks();};
    top.append(title,x);
    const days=document.createElement('div');days.className='days';
    ORDER.forEach(wd=>{
      const b=document.createElement('button'); b.textContent=WEEKDAYS[wd];
      if(t.days.includes(wd)) b.className='on';
      b.onclick=()=>{ if(t.days.includes(wd)) t.days=t.days.filter(d=>d!==wd); else t.days.push(wd); save();renderTemplates();renderTasks(); };
      days.appendChild(b);
    });
    div.append(top,days);box.appendChild(div);
  });
}
function addTemplate(){
  const inp=document.getElementById('tmplInput');
  const title=inp.value.trim(); if(!title) return;
  state.templates.push({id:uid(),title,days:[]});
  inp.value=''; save(); renderTemplates(); renderTasks();
}

// --- СОБЫТИЯ ---
document.getElementById('prev').onclick=()=>{currentDate=shiftDate(currentDate,-1);render();};
document.getElementById('next').onclick=()=>{currentDate=shiftDate(currentDate,1);render();};
document.getElementById('dateWrap').onclick=()=>{currentDate=todayISO();render();};
document.getElementById('navTasks').onclick=()=>switchView('tasks');
document.getElementById('navCalories').onclick=()=>switchView('calories');
document.getElementById('addBtn').onclick=addCustom;
document.getElementById('addInput').addEventListener('keydown',e=>{if(e.key==='Enter')addCustom();});
document.getElementById('addFoodBtn').onclick=addFood;
foodWeightInput.addEventListener('keydown',e=>{if(e.key==='Enter')addFood();});
document.getElementById('tmplAdd').onclick=addTemplate;
document.getElementById('tmplInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTemplate();});
document.getElementById('openTmpl').onclick=()=>{renderTemplates();document.getElementById('modal').classList.add('open');};
document.getElementById('closeTmpl').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open');});

document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='planner-backup-'+todayISO()+'.json'; a.click();
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d.templates) throw 0;
    if(!confirm('Заменить текущие данные?')) return;
    state={templates:d.templates||[],entries:d.entries||{},done:d.done||{},skipped:d.skipped||{},food:d.food||{},customFoods:d.customFoods||{}};
    save(); renderTemplates(); render();
  }catch{alert('Неверный файл');}};
  r.readAsText(f);
};

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
